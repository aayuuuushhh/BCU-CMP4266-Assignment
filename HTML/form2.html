<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <div>
        <div>
          <h1>REGISTER</h1>
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Enter your name" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" />
        </div>
        <div>
          <label for="">Gender:</label>
          <label for="male">Male</label>
          <input type="radio" id="male" name="a" />

          <label for="female">Female</label>
          <input type="radio" id="female" name="a" />

          <label for="other">Prefer Not to Say</label>
          <input type="radio" id="other" name="a" />
        </div>
        <div>
          <label for="college">College</label>
          <select name="" id="college">
            <option value="">Sunway</option>
            <option value="">Deerwalk</option>
            <option value="">Softwarica</option>
            <option value="">Texas</option>
            <option value="">Islington</option>
          </select>
        </div>
        <div>
          <label for="car">Own a Car</label>
          <input type="checkbox" />
        </div>
        <div>
          <label for="profile">Profile Picture</label>
          <input type="file" id="profile" />
        </div>
      </div>
      <div>
        <button>Submit</button>
      </div>
    </form>
  </body>
</html>
