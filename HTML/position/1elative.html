<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        color: black;
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      .box {
        width: 100px;
        height: 100px;
        background-color: red;
        position: relative;
        /* top: 0px; */
        /* bottom: -20px; */
        /* left: 50px; */
        right: -10px;
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>

<!--
static
it does not support top, bottom, left, right
by default every element is static  

relative
it supports top, bottom, left, right
-->
